<div class=" min-h-screen">
  <!-- Header -->
  <header class="header">
    <!-- Ľavá časť - menu tlačidlo -->
    <div class="menu-btn" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Stredná časť - logo a názov -->
    <div class="center-section">
      <div class="logo-container" routerLink="/" style="cursor: pointer;">
        <!-- Replace with a simple icon from your icon library -->
        <div class="logo-icon">✓</div>
        <div class="logo">TASK<span>&</span>HABITS</div>
      </div>
    </div>

    <!-- Pravá časť - prepínač témy a profil -->
    <div class="right-section">
      <!-- Prepínač témy -->
      <div class="simple-toggle">
        <span>Svetlý</span>
        <button
          class="mode-toggle" (click)="modeToggleSwitch()">
          <i class="icon" [ngClass]="{'dark': darkModeActive, 'light': !darkModeActive}"></i>
          {{ darkModeActive ? 'Svetlý režim' : 'Tmavý režim' }}
        ></button>
        <span>Tmavý</span>
      </div>

      <button *ngIf="!isLoggedIn" class="login-btn" routerLink="/login">Login</button>

      <!-- Profile icon (shown when logged in) -->
      <div *ngIf="isLoggedIn" class="profile-icon" (click)="toggleProfileMenu()">
        {{ currentUser?.username?.charAt(0) || 'U' }}
      </div>

      <!-- Profile dropdown menu (shown when logged in and menu opened) -->
      <div *ngIf="isLoggedIn" class="profile-menu" [class.active]="showProfileMenu">
        <div class="profile-menu-header">
          <h3>User Profile</h3>
        </div>
        <div class="profile-menu-body">
          <p><strong>Username:</strong> {{ currentUser?.username }}</p>
          <p><strong>Email:</strong> {{ currentUser?.email }}</p>
        </div>
        <div class="profile-menu-footer">
          <button class="profile-menu-button logout" (click)="logout()">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Side Menu -->
  <nav class="side-menu" [class.active]="showMenu">
    <a routerLink="/tasks" class="menu-item" (click)="toggleMenu()">
      <svg class="menu-item-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Tasks
    </a>
    <a routerLink="/habits" class="menu-item" (click)="toggleMenu()">
      <svg class="menu-item-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Habits
    </a>
  </nav>


    <!-- Hlavný obsah -->
  <main class="main-content" [class.menu-open]="showMenu">
    <router-outlet></router-outlet>
  </main>


</div>
