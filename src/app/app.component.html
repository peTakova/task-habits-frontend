<div class=" min-h-screen bg-gray-100:bg-gray-900 ">
  <!-- Header -->
  <header class="header">
    <!-- Ľavá časť - menu tlačidlo -->
    <div class="menu-btn" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Stredná časť - logo a názov -->
    <div class="center-section">
      <div class="logo-container">
        <img src="assets/images/logo_task.png" alt="Task & Habits Logo" class="logo-image">
        <div class="logo">TASK<span>&</span>HABITS</div>
      </div>
    </div>

    <!-- Pravá časť - prepínač témy a profil -->
    <div class="right-section">
      <!-- Prepínač témy -->
      <div class="simple-toggle">
        <span>Svetlý</span>
        <button
          class="toggle-btn"
          [class.toggle-active]="darkModeActive"
          (click)="modeToggleSwitch()"
        ></button>
        <span>Tmavý</span>
      </div>

      <!-- Profil -->
      <div class="profile-icon">JD</div>
    </div>
  </header>

  <!-- Side Menu -->
  <nav class="side-menu" [class.active]="showMenu">
    <div class="menu-item">
      <svg class="menu-item-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Tasks
    </div>
    <div class="menu-item">
      <svg class="menu-item-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Habits
    </div>
  </nav>


    <!-- Hlavný obsah -->
  <main class="container mx-auto px-4 py-6">
    <app-task-form></app-task-form>
    <app-task-list></app-task-list>
    <app-habit-list></app-habit-list>
  </main>


</div>
